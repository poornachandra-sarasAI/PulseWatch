[project]
name = "pulsewatch-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14,<2.0",
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "pydantic>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[tool.pyright]
venvPath = ".."
venv = ".venv"
pythonVersion = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
